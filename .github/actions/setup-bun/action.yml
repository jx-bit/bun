name: Setup Bun
description: An internal version of the 'oven-sh/setup-bun' action.

inputs:
  bun-version:
    type: string
    description: "The version of bun to install: 'latest', 'canary', 'bun-v1.2.0', etc."
    default: latest
    required: false
  baseline:
    type: boolean
    description: "Whether to use the baseline version of bun."
    default: false
    required: false
  download-url:
    type: string
    description: "The base URL to download bun from."
    default: "https://pub-5e11e972747a44bf9aaf9394f185a982.r2.dev/releases"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Bun
      shell: bash
      run: |
        case "$(uname -s)" in
          Linux*)  os=linux;;
          Darwin*) os=darwin;;
          *)       os=windows;;
        esac
        case "$(uname -m)" in
          arm64 | aarch64)  arch=aarch64;;
          *)                arch=x64;;
        esac
        case "${{ inputs.baseline }}" in
          true | 1) target="bun-${os}-${arch}-baseline";;
          *)        target="bun-${os}-${arch}";;
        esac
        case "${{ inputs.bun-version }}" in
          latest) release="latest";;
          canary) release="canary";;
          *)      release="bun-v${{ inputs.bun-version }}";;
        esac
        curl -LO "${{ inputs.download-url }}/${release}/${target}.zip" --retry 5
        unzip ${target}.zip
        # runner.temp on Windows is "D:\a\_temp" — bare backslashes get eaten
        # by bash (\a -> a, \_ -> _), mangling the path to "D:a_temp". Capture
        # into a var and slash-convert so mkdir/mv/ln resolve the real dir on
        # both Git Bash (Windows) and POSIX hosts (no-op there).
        BUN_TMP="${{ runner.temp }}"
        BUN_TMP="${BUN_TMP//\\//}"
        mkdir -p "$BUN_TMP/.bun/bin"
        mv ${target}/bun* "$BUN_TMP/.bun/bin/"
        chmod +x "$BUN_TMP/.bun/bin/"*
        # bunx = bun alias. On Windows Git Bash, ln -s may fall back to a
        # copy or fail entirely if symlink support is off; cp is a safe
        # fallback (bunx just needs to exec bun). On POSIX ln -s works.
        ln -fs "$BUN_TMP/.bun/bin/bun" "$BUN_TMP/.bun/bin/bunx" 2>/dev/null \
          || cp -f "$BUN_TMP/.bun/bin/bun"* "$BUN_TMP/.bun/bin/bunx"
        echo "$BUN_TMP/.bun/bin" >> ${GITHUB_PATH}
