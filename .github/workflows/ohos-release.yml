# Bun OHOS Release Workflow
#
# Builds, pre-signs, and publishes a Bun binary for HarmonyOS (OHOS).
# Creates a GitHub Release with:
#   - bun-ohos-aarch64-<v>-<c>.tar.gz (pre-signed tarball — the whole install
#                                     story: signed bun + README)
#   - bun-ohos-aarch64-unsigned       (raw build output, sign yourself on device)
#
# Triggers:
#   - Tag push: ANY tag (rolling ohos-latest/latest and ohos-full-v* excluded)
#   - Manual: workflow_dispatch
#
# Signing: the tarball's bun is pre-signed with the ohos-selfsign CLI
# (src/ohos_sign — pure-Rust, content-based self-signature, no cert needed),
# so it runs on device out of the box; the unsigned variant ships alongside
# for users who prefer device-side signing. No install script — the tarball
# is the whole install story.

name: OHOS Release

on:
  push:
    tags:
      # Any pushed tag cuts a self-contained release: script + binary +
      # archive paired to THIS tag. Excluded: the CI-managed rolling tags
      # (owned by ohos-build-github.yml) and the shared-dir build tags
      # (owned by ohos-full-release.yml, no GitHub release).
      - '*'
      - '!ohos-latest'
      - '!latest'
      - '!ohos-full-v*'
  workflow_dispatch:
    inputs:
      webkit_ref:
        description: 'WebKit fork branch/tag'
        required: false
        default: 'ohos-aarch64'
        type: string

concurrency:
  group: ohos-release
  cancel-in-progress: false  # Don't cancel releases in progress

env:
  OHOS_SDK_ROOT: /home/user/setup-ohos-sdk
  OHOS_SYSROOT: /home/user/setup-ohos-sdk/ohos/native/sysroot
  OHOS_CROSS_LIBS: /home/user/sources/bun/build/ohos-cross-libs
  OHOS_ICU_DIR: /home/user/sources/bun/build/ohos-icu/target
  CARGO_INCREMENTAL: 1
  CARGO_TARGET_DIR: /home/user/sources/bun/build/release-ohos/rust-target
  RUSTC_WRAPPER: ""
  NINJA_JOBS: 2
  WEBKIT_FORK: oven-sh/WebKit
  WEBKIT_REF: ohos-aarch64

jobs:
  release:
    name: Build & Release Bun for OHOS
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 300
    permissions:
      contents: write

    steps:
      # ===== Build (same as ohos-build-rust.yml) =====

      - name: Checkout Bun source (incremental)
        run: |
          LOCAL=/home/user/sources/bun
          rm -rf bun
          if [ -d "$LOCAL/.git" ]; then
            git clone --reference "$LOCAL/.git" \
              https://ghfast.top/${{ github.server_url }}/${{ github.repository }}.git bun 2>/dev/null || \
            git clone --depth 1 --branch ohos-aarch64 \
              https://ghfast.top/${{ github.server_url }}/${{ github.repository }}.git bun
            cd bun
            git fetch origin ohos-aarch64 --depth=1
            git checkout -f FETCH_HEAD
            echo "✅ Cloned from local reference"
          else
            git clone --depth 1 --branch ohos-aarch64 \
              https://ghfast.top/${{ github.server_url }}/${{ github.repository }}.git bun
            echo "⚠️ Full clone (no local reference)"
          fi

      - name: Restore Rust cargo cache
        run: |
          mkdir -p bun/.cargo
          SRC_CACHE=/home/user/sources/bun/.cargo
          [ -d "$SRC_CACHE/registry" ] && cp -a "$SRC_CACHE/registry" bun/.cargo/registry 2>/dev/null || true

      - name: Restore Rust incremental build artifacts
        run: |
          SRC_TARGET=/home/user/sources/bun/build/release-ohos/rust-target
          if [ -d "$SRC_TARGET" ]; then
            mkdir -p bun/build/release-ohos
            cp -a --link "$SRC_TARGET" bun/build/release-ohos/rust-target 2>/dev/null || \
            cp -a "$SRC_TARGET" bun/build/release-ohos/rust-target 2>/dev/null || true
          fi

      - name: Checkout WebKit fork (incremental)
        run: |
          LOCAL_WK=/home/user/sources/bun/vendor/WebKit
          WK_REPO=${{ env.WEBKIT_FORK }}
          WK_REF=${{ inputs.webkit_ref || env.WEBKIT_REF }}
          rm -rf bun/vendor/WebKit
          if [ -d "$LOCAL_WK/.git" ]; then
            git clone --reference "$LOCAL_WK/.git" --dissociate \
              --depth 1 --branch "$WK_REF" \
              "https://ghfast.top/https://github.com/$WK_REPO.git" bun/vendor/WebKit 2>/dev/null || \
            cp -a --link "$LOCAL_WK" bun/vendor/WebKit
            cd bun/vendor/WebKit
            git remote set-url origin "https://ghfast.top/https://github.com/$WK_REPO.git"
            git fetch origin "$WK_REF" --depth=1 2>/dev/null || true
            git checkout -f FETCH_HEAD
          else
            git clone --depth 1 --branch "$WK_REF" \
              "https://ghfast.top/https://github.com/$WK_REPO.git" bun/vendor/WebKit
          fi

      - name: WebKit version sync check
        run: |
          WK_HASH=$(grep "^export const WEBKIT_VERSION" bun/scripts/build/deps/webkit.ts | grep -oE '[a-f0-9]{40}')
          if git -C bun/vendor/WebKit cat-file -e "${WK_HASH}" 2>/dev/null; then
            echo "✅ vendor/WebKit contains ${WK_HASH}"
          else
            echo "⚠️ vendor/WebKit missing ${WK_HASH}, build continues"
          fi

      - name: Install system dependencies
        run: |
          if ! rpm -q libatomic &>/dev/null; then
            dnf install -y libatomic 2>&1 | tail -3
          fi

      - name: Setup environment
        run: |
          echo "OHOS_SDK_ROOT=${{ env.OHOS_SDK_ROOT }}" >> $GITHUB_ENV
          echo "OHOS_SYSROOT=${{ env.OHOS_SYSROOT }}" >> $GITHUB_ENV
          echo "OHOS_CROSS_LIBS=${{ env.OHOS_CROSS_LIBS }}" >> $GITHUB_ENV
          echo "OHOS_ICU_DIR=${{ env.OHOS_ICU_DIR }}" >> $GITHUB_ENV
          test -d "$OHOS_SDK_ROOT" || { echo "❌ OHOS SDK not found"; exit 1; }
          mkdir -p bun/build
          [ -L bun/build/ohos-cross-libs ] && [ "$(readlink bun/build/ohos-cross-libs)" = "$OHOS_CROSS_LIBS" ] || ln -sfn "$OHOS_CROSS_LIBS" bun/build/ohos-cross-libs
          [ -L bun/build/ohos-icu ] && [ "$(readlink bun/build/ohos-icu)" = "$(dirname $OHOS_ICU_DIR)" ] || ln -sfn "$(dirname $OHOS_ICU_DIR)" bun/build/ohos-icu
          test -d bun/build/ohos-cross-libs/libcxx/lib || { echo "❌ Cross libs not found"; exit 1; }
          test -d bun/build/ohos-icu/target/lib || { echo "❌ ICU not found"; exit 1; }
          echo "PATH=$OHOS_SDK_ROOT/llvm-22/bin:$PATH" >> $GITHUB_ENV
          echo "CC=$OHOS_SDK_ROOT/llvm-22/bin/clang" >> $GITHUB_ENV
          echo "CXX=$OHOS_SDK_ROOT/llvm-22/bin/clang++" >> $GITHUB_ENV
          echo "✅ Environment ready"

      - name: Restore incremental build artifacts
        run: |
          CACHE_DIR=/home/user/actions-runner/_work/_cache/ohos-build
          if [ -d "$CACHE_DIR" ]; then
            mkdir -p bun/build/release-ohos/deps
            for dep_dir in deps/WebKit obj vendor; do
              src="$CACHE_DIR/$dep_dir"
              dst="bun/build/release-ohos/$dep_dir"
              [ -d "$src" ] && cp -a --link "$src" "$dst" 2>/dev/null || true
            done
          fi

      - name: Extract WebKit version for cache key
        id: webkit-version
        run: |
          WK_VER=$(grep "^export const WEBKIT_VERSION" bun/scripts/build/deps/webkit.ts | grep -oE '[a-f0-9]{40}')
          echo "version=${WK_VER}" >> $GITHUB_OUTPUT

      - name: Cache WebKit build
        uses: actions/cache@v4
        id: webkit-cache
        with:
          path: bun/build/release-ohos/deps/WebKit
          key: webkit-ohos-rust-${{ inputs.webkit_ref || env.WEBKIT_REF }}-${{ steps.webkit-version.outputs.version }}

      - name: Configure Bun build
        working-directory: bun
        run: |
          bun run build:release \
            --os=ohos \
            --arch=aarch64 \
            --webkit=local \
            --build-dir=build/release-ohos \
            --ohos-sysroot=$OHOS_SYSROOT \
            --configure-only
        env:
          CI: true

      - name: Patch build.ninja for OHOS host compilation
        working-directory: bun
        run: |
          if grep -q "llvm-22/bin/clang \$flags -o \$out \$in" build/release-ohos/build.ninja 2>/dev/null; then
            sed -i 's|command = .*/llvm-22/bin/clang $flags -o $out $in|command = /usr/bin/clang $flags -o $out $in|' \
              build/release-ohos/build.ninja
          fi
          if [ -f build/release-ohos/deps/WebKit/build.ninja ]; then
            sed -i 's/-lpthreads/-lpthread/g' build/release-ohos/deps/WebKit/build.ninja
          fi
          if [ -f .cargo/config.toml ] && grep -q 'aarch64-unknown-linux-gnu' .cargo/config.toml; then
            python3 -c "
          import re
          with open('.cargo/config.toml', 'r') as f:
              content = f.read()
          content = re.sub(
              r'\[target\.aarch64-unknown-linux-gnu\]\nlinker = \"[^\"]*\"',
              '[target.aarch64-unknown-linux-gnu]\nlinker = \"/usr/bin/clang++\"',
              content
          )
          with open('.cargo/config.toml', 'w') as f:
              f.write(content)
          " || true
          fi

      - name: Build WebKit
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        working-directory: bun
        run: |
          ninja -C build/release-ohos configure-WebKit -j1
          ninja -C build/release-ohos/deps/WebKit jsc -j$NINJA_JOBS

      - name: Build Bun
        working-directory: bun
        run: |
          ninja -C build/release-ohos bun -j$NINJA_JOBS || {
            echo "⚠️ First ninja run failed, retrying..."
            ninja -C build/release-ohos bun -j$NINJA_JOBS
          }

      - name: Verify binary
        working-directory: bun
        run: |
          file build/release-ohos/bun
          ls -lh build/release-ohos/bun
          file build/release-ohos/bun | grep -q "ELF.*ARM aarch64" || {
            echo "ERROR: Not an ARM64 ELF binary"; exit 1
          }
          NEEDED=$(readelf -d build/release-ohos/bun | grep "NEEDED" | sed 's/.*\[//;s/\]//')
          for lib in $NEEDED; do
            case "$lib" in
              libc.so|libc++.so) echo "✅ Expected: $lib" ;;
              *) echo "ERROR: Unexpected dynamic dependency: $lib"; exit 1 ;;
            esac
          done
          echo "✅ Binary validation passed"

      # ===== Signing =====
      # Pre-signed here with ohos-selfsign (src/ohos_sign, std-only Rust):
      # the device-side binary-sign-tool cannot run on openEuler, and the
      # self-signature is content-based (file_size + merkle root), so the
      # same bytes work on any OHOS device out of the box.
      # Two variants ship side by side (user's choice): the build output
      # stays UNTOUCHED as the -unsigned asset; the signed copy takes the
      # canonical asset name (recommended, runs without on-device signing).

      - name: Pre-sign binary (out-of-the-box release assets)
        working-directory: bun
        run: |
          set -e
          command -v cargo >/dev/null 2>&1 || export PATH="$HOME/.cargo/bin:$PATH"
          # Standalone copy: configure generates .cargo/config.toml with a
          # linker for the ninja build's OHOS-target setup; outside the
          # workspace cargo uses the default linker. The crate has zero
          # dependencies — no registry access needed.
          rm -rf /tmp/ohos_sign-build
          cp -r src/ohos_sign /tmp/ohos_sign-build
          (cd /tmp/ohos_sign-build && cargo build --release --bin ohos-selfsign)
          SIGNER=/tmp/ohos_sign-build/target/release/ohos-selfsign
          # --force: strip + re-sign if a stale section ever sneaks in.
          "$SIGNER" sign --force --output build/release-ohos/bun-signed build/release-ohos/bun
          # Kernel-equivalent gate (file_size + merkle root recompute), not
          # just section presence — an invalid descriptor must fail here,
          # not on devices as EACCES.
          "$SIGNER" verify build/release-ohos/bun-signed
          echo "✅ signed variant ready (unsigned build output kept alongside)"

      # ===== Package & Release =====

      - name: Package release
        id: package
        working-directory: bun
        run: |
          BIN=build/release-ohos/bun
          TAG="${{ github.ref_name }}"
          VERSION=$($BIN --version 2>/dev/null || python3 -c "import json; print(json.load(open('package.json'))['version'])")
          COMMIT=$(git rev-parse --short HEAD)
          DATE=$(date +%Y%m%d_%H%M%S)

          RELEASE_DIR=/tmp/bun-release
          rm -rf $RELEASE_DIR && mkdir -p $RELEASE_DIR

          # Two OHOS assets, user's choice: the pre-signed tarball (primary,
          # extract and run) and the raw unsigned build output (sign yourself
          # on device).
          cp $BIN $RELEASE_DIR/bun-ohos-aarch64-unsigned

          # Versioned tar.gz (signed bun + README — the whole install story)
          ARCHIVE_NAME="bun-ohos-aarch64-${VERSION}-${COMMIT}"
          mkdir -p $RELEASE_DIR/$ARCHIVE_NAME
          cp build/release-ohos/bun-signed $RELEASE_DIR/$ARCHIVE_NAME/bun
          cat > $RELEASE_DIR/$ARCHIVE_NAME/README.md << 'EOF'
          # Bun for HarmonyOS (OHOS) aarch64

          The bundled bun is pre-signed — run it directly:

              chmod +x bun && ./bun --version

          Optional — add to PATH for the current session:

              export PATH="$PWD:$PATH"

          If exec fails with "Permission denied" after `chmod +x bun`, the
          archive was corrupted — re-download it (the embedded signature is
          what the kernel validates at exec).
          EOF
          cd $RELEASE_DIR
          tar czf ${ARCHIVE_NAME}.tar.gz $ARCHIVE_NAME/

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
          echo "unsigned_binary_path=$RELEASE_DIR/bun-ohos-aarch64-unsigned" >> $GITHUB_OUTPUT
          echo "archive_path=$RELEASE_DIR/${ARCHIVE_NAME}.tar.gz" >> $GITHUB_OUTPUT
          echo "✅ Packaged: ${ARCHIVE_NAME}.tar.gz (signed) + bun-ohos-aarch64-unsigned"

      - name: Generate release body
        id: body
        # Same layout as every other release page: Quick Install (inline,
        # self-paired), a Products table (sizes known only at package time),
        # and the Release Notes link to the seeded release-docs placeholder.
        run: |
          TAG="${{ github.ref_name }}"
          RELEASE_DIR=/tmp/bun-release
          {
            echo '## Bun for HarmonyOS (OHOS) aarch64'
            echo ''
            echo "Version: ${{ steps.package.outputs.version }}"
            echo "Commit: ${{ github.sha }}"
            echo ''
            echo '### Disclaimer'
            echo ''
            echo 'This is an independent, non-commercial community port provided as-is, with no warranty. It is not accessory software for, nor after-sales support of, any Huawei product, and has no affiliation with the OpenHarmony community or Huawei.'
            echo ''
            echo '### Known Limitations'
            echo ''
            echo 'Due to HarmonyOS system restrictions (sandboxing, code signing, kernel differences), some features are missing or degraded — see the release notes above for details.'
          echo ''
            echo '### Quick Install (OHOS device)'
            echo ''
            echo 'Pre-signed tarball — extract and run, no signing needed:'
            echo ''
            echo '```bash'
            echo "curl -fsSL -o bun.tar.gz https://github.com/jx-bit/bun/releases/download/${TAG}/${{ steps.package.outputs.archive_name }}.tar.gz"
            echo "tar xzf bun.tar.gz && ./${{ steps.package.outputs.archive_name }}/bun --version"
            echo '```'
            echo ''
            echo ''
            echo '### Products'
            echo ''
            echo '| File | Target | Build | Size |'
            echo '|---|---|---|---|'
            for f in "$RELEASE_DIR/bun-ohos-aarch64-unsigned" \
                     "$RELEASE_DIR/${{ steps.package.outputs.archive_name }}.tar.gz"; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              case "$name" in
                bun-ohos-aarch64-unsigned) target='OHOS (HarmonyOS) aarch64'; build='self-hosted lane (no .codesign)' ;;
                *.tar.gz)            target='OHOS archive';              build='signed bun + README' ;;
                *)                   target='?';                         build='?' ;;
              esac
              printf '| %s | %s | %s | %s |\n' "$name" "$target" "$build" "$size"
            done
            echo ''
            echo '### Release Notes'
            echo ''
            echo "[详细说明（发布后可持续更新）](https://github.com/jx-bit/bun/blob/release-docs/releases/${TAG}/README.md)"
            echo ''
          } > /tmp/bun-release-body.md
          echo "path=/tmp/bun-release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.unsigned_binary_path }}
            ${{ steps.package.outputs.archive_path }}
          name: "Bun OHOS ${{ github.ref_name }}"
          body_path: ${{ steps.body.outputs.path }}

      - name: Seed release-docs placeholders
        # The release bodies link to releases/<tag>/README.md (tag release)
        # and releases/ohos-latest/README.md (rolling) on the release-docs
        # branch — auto-create placeholders so the links never dangle; the
        # developer fills them in afterwards (direct push to release-docs,
        # no PR). Idempotent: an existing file is never overwritten (re-runs
        # and developer content must survive).
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          python3 - "$TAG" "${{ github.repository }}" \
            "${{ steps.package.outputs.version }}" "${{ github.sha }}" <<'PYEOF'
          import base64, json, os, sys, time, urllib.error, urllib.request
          tag, repo, version, commit = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
          token = os.environ["GITHUB_TOKEN"]
          def api(method, path, data=None):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/{path}", method=method,
                  data=json.dumps(data).encode() if data else None,
                  headers={"Authorization": f"Bearer {token}",
                           "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      body = resp.read()
                      return resp.status, (json.loads(body) if body else {})
              except urllib.error.HTTPError as e:
                  return e.code, {}
          placeholder_tag = (
              f"# {tag}\n\n"
              "> 占位文档 —— 发布流水线自动生成，等待开发者补充。\n"
              "> 直接编辑本文件并 push 到 `release-docs` 分支，"
              "release 页面的链接会自动显示最新内容。\n\n"
              f"- 版本：{version}\n"
              f"- 提交：`{commit}`\n"
              f"- Release：<https://github.com/{repo}/releases/tag/{tag}>\n\n"
              "## 补充说明\n\n"
              "（本次变更内容、已知问题、升级注意事项……）\n\n"
              "## 已知限制\n\n"
              "（鸿蒙系统限制导致的功能缺失/降级，具体条目……）\n"
          )
          placeholder_rolling = (
              "# ohos-latest（滚动发布线）\n\n"
              "> 占位文档 —— 发布流水线自动生成，等待开发者补充。\n"
              "> 此文档描述滚动线的当前状态（在途变更、已知问题等），"
              "直接编辑并 push 到 `release-docs` 分支，"
              "release 页面的链接会自动显示最新内容。\n\n"
              "## 已知限制\n\n"
              "（鸿蒙系统限制导致的功能缺失/降级，具体条目……）\n"
          )
          # The contents API intermittently 500s (observed live); retrying the
          # whole probe+create sequence also covers a 500 whose PUT actually
          # landed server-side (the re-probe sees the file and skips).
          docs = [
              (f"releases/{tag}/README.md", placeholder_tag),
              ("releases/ohos-latest/README.md", placeholder_rolling),
          ]
          for doc, content in docs:
              seeded = False
              for attempt in range(3):
                  status, _ = api("GET", f"contents/{doc}?ref=release-docs")
                  if status == 200:
                      print(f"✅ {doc} already exists on release-docs — untouched")
                      seeded = True
                      break
                  if status == 404:
                      status, _ = api("PUT", f"contents/{doc}", {
                          "message": f"docs: seed placeholder for {doc}",
                          "branch": "release-docs",
                          "content": base64.b64encode(content.encode()).decode(),
                      })
                      if status in (200, 201):
                          print(f"✅ seeded {doc} on release-docs")
                          seeded = True
                          break
                  if attempt < 2:
                      print(f"⚠️ {doc}: attempt {attempt + 1} failed (HTTP {status}), retrying...")
                      time.sleep(5 * (attempt + 1))
              if not seeded:
                  hint = " — is the release-docs branch present?" if status == 404 else ""
                  print(f"❌ could not seed {doc} after 3 attempts (last HTTP {status}){hint}")
                  sys.exit(1)
          PYEOF

      - name: Verify published releases
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          # Published-asset presence via API (self-hosted runner has no gh).
          python3 - "$TAG" "${{ github.repository }}" "${{ steps.package.outputs.archive_name }}" <<'PYEOF'
          import json, os, sys, urllib.error, urllib.request
          tag, repo, archive = sys.argv[1], sys.argv[2], sys.argv[3]
          token = os.environ["GITHUB_TOKEN"]
          def release_assets(rel):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/releases/tags/{rel}",
                  headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      return {a["name"] for a in json.load(resp)["assets"]}
              except urllib.error.HTTPError as e:
                  print(f"❌ release {rel} not readable (HTTP {e.code})")
                  sys.exit(1)
          need = {"bun-ohos-aarch64-unsigned", f"{archive}.tar.gz"}
          for rel in (tag,):
              missing = need - release_assets(rel)
              if missing:
                  print(f"❌ release {rel} missing assets: {sorted(missing)}")
                  sys.exit(1)
          # The release bodies link to release-docs placeholders — gate them
          # like the assets so a dangling link fails the run.
          for doc in (f"releases/{tag}/README.md", "releases/ohos-latest/README.md"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}/contents/{doc}?ref=release-docs",
                  headers={"Authorization": f"Bearer {token}"})
              try:
                  with urllib.request.urlopen(req) as resp:
                      resp.read()
              except urllib.error.HTTPError as e:
                  print(f"❌ release-docs placeholder missing: {doc} (HTTP {e.code})")
                  sys.exit(1)
          print(f"✅ release {tag} verified: all paired assets + release-docs placeholders")
          PYEOF

      - name: Copy to shared directory
        working-directory: bun
        run: |
          SHARE=/mnt/linux_share/ci-test
          mkdir -p $SHARE
          cp build/release-ohos/bun $SHARE/bun-ohos-release.elf
          echo "✅ Copied to $SHARE/bun-ohos-release.elf"
