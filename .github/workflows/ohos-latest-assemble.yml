# Bun OHOS Latest Assemble
#
# ljy-style multi-product rolling release: after the OHOS container build
# succeeds on ohos-aarch64, run the cross-compile legs against the SAME
# commit, then publish every product to one rolling `latest` release whose
# body names the baseline commit.
#
# Products:
#   bun-ohos-aarch64    (OHOS container lane artifact, this workflow_run)
#   bun-linux-x64       (cross-x86 leg)
#   bun-windows-x64.exe (cross-x86 leg)
#   bun-darwin-arm64    (cross-x86 leg)
#
# The `latest` bundle is separate from the OHOS-only `ohos-latest` release
# that ohos-build-github.yml keeps publishing — same model as the reference
# delivery line (their `ohos-latest` + `latest` pair).

name: OHOS Latest Assemble

on:
  workflow_run:
    workflows: ["OHOS Build (GitHub-hosted, social4hyq container)"]
    types: [completed]
    branches: [ohos-aarch64]

concurrency:
  group: ohos-latest-assemble
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  start:
    # Record the assembly start time: the cross run started by `cross` is
    # located later by created-at >= this timestamp (workflow_call runs
    # inherit the caller's head_sha, which is the default branch — not the
    # delivery commit — so head_sha filtering cannot find it).
    runs-on: ubuntu-latest
    outputs:
      since: ${{ steps.t.outputs.since }}
    steps:
      - id: t
        run: echo "since=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

  cross:
    needs: [start]
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    uses: ./.github/workflows/cross-x86.yml
    with:
      sha: ${{ github.event.workflow_run.head_sha }}

  publish:
    needs: [start, cross]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - name: Resolve source runs
        id: runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA='${{ github.event.workflow_run.head_sha }}'
          OHOS_RUN='${{ github.event.workflow_run.id }}'
          SINCE='${{ needs.start.outputs.since }}'
          CROSS_RUN=$(gh api \
            "repos/${{ github.repository }}/actions/workflows/cross-x86.yml/runs?created=%3E%3D$SINCE&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id')
          if [ -z "$CROSS_RUN" ] || [ "$CROSS_RUN" = "null" ]; then
            echo "no successful cross-x86 run since $SINCE" >&2
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ohos_run=$OHOS_RUN" >> "$GITHUB_OUTPUT"
          echo "cross_run=$CROSS_RUN" >> "$GITHUB_OUTPUT"

      - name: Download OHOS binary (from the container-lane run)
        uses: actions/download-artifact@v4
        with:
          name: bun-ohos-aarch64-github
          run-id: ${{ steps.runs.outputs.ohos_run }}
          github-token: ${{ github.token }}
          path: dist-ohos

      - name: Download cross binaries (from the cross run)
        uses: actions/download-artifact@v4
        with:
          pattern: bun-cross-*
          run-id: ${{ steps.runs.outputs.cross_run }}
          github-token: ${{ github.token }}
          path: dist-cross
          merge-multiple: true

      - name: Stage products
        run: |
          mkdir -p dist
          cp dist-ohos/build/release-ohos/bun                         dist/bun-ohos-aarch64
          cp dist-cross/build/cross-linux-x64/bun                    dist/bun-linux-x64
          cp dist-cross/build/cross-linux-arm64/bun                  dist/bun-linux-arm64
          cp dist-cross/build/cross-windows-x64/bun.exe              dist/bun-windows-x64.exe
          cp dist-cross/build/cross-darwin-arm64/bun                 dist/bun-darwin-arm64
          ls -la dist/

      - name: Publish rolling latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA='${{ steps.runs.outputs.sha }}'
          BODY=/tmp/latest-body.md
          {
            printf 'Products built from the same baseline commit `%s` (ohos-aarch64).\n\n' "$SHA"
            echo '## Products'
            echo ''
            echo '| File | Target | Build | Size |'
            echo '|---|---|---|---|'
            for f in dist/*; do
              name=$(basename "$f")
              size=$(du -h "$f" | cut -f1)
              case "$name" in
                bun-ohos-aarch64)    target='OHOS (HarmonyOS) aarch64'; build='container lane' ;;
                bun-linux-x64)       target='Linux x86_64 (glibc)';    build='cross (aarch64 host)' ;;
                bun-linux-arm64)     target='Linux arm64 (glibc)';     build='native (arm64 host)' ;;
                bun-windows-x64.exe) target='Windows x86_64';          build='cross' ;;
                bun-darwin-arm64)    target='macOS arm64';             build='cross' ;;
                *)                   target='?';                       build='?' ;;
              esac
              printf '| %s | %s | %s | %s |\n' "$name" "$target" "$build" "$size"
            done
            echo ''
            echo '## Quick Install (OHOS device)'
            echo ''
            echo '```bash'
            echo 'curl -fsSL https://github.com/jx-bit/bun/releases/download/ohos-latest/install-bun-ohos.sh | sh'
            echo '```'
          } > "$BODY"
          if gh release view latest --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload latest dist/* --repo "${{ github.repository }}" --clobber
            gh release edit latest --repo "${{ github.repository }}" --notes-file "$BODY" --title "Bun OHOS Cross-Build (latest)"
          else
            gh release create latest dist/* --repo "${{ github.repository }}" \
              --title "Bun OHOS Cross-Build (latest)" --notes-file "$BODY"
          fi
